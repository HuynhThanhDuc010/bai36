<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hứng Táo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
        }
        #game-container {
            width: 500px;
            height: 400px;
            margin: 20px auto;
            background: #dff3ff;
            border: 3px solid #8b5a2b;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }
        #basket {
            width: 80px;
            height: 25px;
            background: brown;
            border-radius: 5px 5px 15px 15px;
            position: absolute;
            bottom: 10px;
            left: 210px;
        }
        #apple {
            position: absolute;
            top: 0;
            left: 100px;
            font-size: 30px;
            line-height: 1;
        }
        #game-over {
            display: none;
            position: absolute;
            top: 42%;
            width: 100%;
            color: red;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 1px 1px white;
        }
        button {
            padding: 10px 25px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>GAME HỨNG TÁO</h1>

    <h3>
        Điểm: <span id="score">0</span>
        &nbsp; | &nbsp;
        Mạng sống: <span id="lives">3</span>
    </h3>

    <div id="game-container">
        <div id="apple">🍎</div>
        <div id="basket"></div>
        <div id="game-over">GAME OVER</div>
    </div>

    <button id="start-button">Bắt đầu</button>
    <p>Dùng phím mũi tên trái và phải để di chuyển giỏ.</p>

    <script>
        const game = document.getElementById("game-container");
        const apple = document.getElementById("apple");
        const basket = document.getElementById("basket");
        const scoreDisplay = document.getElementById("score");
        const livesDisplay = document.getElementById("lives");
        const gameOver = document.getElementById("game-over");
        const startButton = document.getElementById("start-button");

        let score = 0;
        let lives = 3;
        let basketSpeed = 20;
        let appleSpeed = 2;
        let timer = null;
        let playing = false;

        // Di chuyển giỏ bằng phím mũi tên
        document.addEventListener("keydown", function(event) {
            if (!playing) return;

            let x = basket.offsetLeft;

            if (event.key === "ArrowLeft") {
                event.preventDefault();
                x -= basketSpeed;
            } else if (event.key === "ArrowRight") {
                event.preventDefault();
                x += basketSpeed;
            }

            let maxLeft = game.clientWidth - basket.offsetWidth;
            x = Math.max(0, Math.min(x, maxLeft));
            basket.style.left = x + "px";
        });

        // Đưa táo về vị trí ngẫu nhiên trên đỉnh
        function resetApple() {
            let maxLeft = game.clientWidth - apple.offsetWidth;
            let x = Math.random() * maxLeft;
            apple.style.left = x + "px";
            apple.style.top = "0px";
        }

        // Kiểm tra va chạm giữa táo và giỏ
        function checkCollision() {
            let appleLeft = apple.offsetLeft;
            let appleTop = apple.offsetTop;
            let basketLeft = basket.offsetLeft;
            let basketTop = basket.offsetTop;

            return (
                appleLeft < basketLeft + basket.offsetWidth &&
                appleLeft + apple.offsetWidth > basketLeft &&
                appleTop < basketTop + basket.offsetHeight &&
                appleTop + apple.offsetHeight > basketTop
            );
        }

        // Cập nhật trò chơi
        function updateGame() {
            if (!playing) return;

            let y = apple.offsetTop + appleSpeed;
            apple.style.top = y + "px";

            if (checkCollision()) {
                score++;
                scoreDisplay.textContent = score;
                appleSpeed += 0.2;
                resetApple();
            } else if (y + apple.offsetHeight >= game.clientHeight) {
                lives--;
                livesDisplay.textContent = lives;

                if (lives <= 0) {
                    endGame();
                    return;
                }
                resetApple();
            }
        }

        // Kết thúc trò chơi
        function endGame() {
            playing = false;
            clearInterval(timer);
            apple.style.display = "none";
            gameOver.style.display = "block";
            startButton.disabled = false;
            startButton.textContent = "Chơi lại";
        }

        // Bắt đầu hoặc chơi lại
        function startGame() {
            clearInterval(timer);
            score = 0;
            lives = 3;
            appleSpeed = 2;
            playing = true;

            scoreDisplay.textContent = score;
            livesDisplay.textContent = lives;
            basket.style.left = "210px";
            apple.style.display = "block";
            gameOver.style.display = "none";

            resetApple();

            startButton.disabled = true;
            startButton.textContent = "Đang chơi";
            timer = setInterval(updateGame, 20);
        }

        startButton.addEventListener("click", startGame);
    </script>
</body>
</html>
