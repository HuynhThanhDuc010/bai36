<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hứng Táo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>GAME HỨNG TÁO</h1>

    <h3>
        Điểm: <span id="score">0</span>
        &nbsp; | &nbsp;
        Mạng sống: <span id="lives">3</span>
    </h3>

    <div id="game-container">
        <div id="apple">🍎</div>
        <div id="basket"></div>
        <div id="game-over">GAME OVER</div>
    </div>

    <button id="start-button">Bắt đầu</button>
    <p>Dùng phím mũi tên trái và phải để di chuyển giỏ.</p>

    <script src="script.js"></script>
</body>
</html>
